{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro Ciudadano</title>
    <link rel="stylesheet" href="{% static 'denuncias/css/style.css' %}">
</head>
<body>
    <div style="max-width: 400px; margin: 60px auto; background-color: #fdf5e6; padding: 30px; box-shadow: 4px 4px 12px rgba(0,0,0,0.3); font-family: sans-serif;">
        <h2 style="text-align: center; color: #3e2723;">REGISTRO (+18 AÑOS)</h2>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" style="width: 100%; background-color: #3e2723; color: white; padding: 10px; border: none; font-weight: bold; cursor: pointer;">Registrarse</button>
        </form>
        <p style="text-align: center; margin-top: 15px;"><a href="{% url 'login' %}" style="color: #cc0000; text-decoration: none;">¿Ya tienes cuenta? Inicia sesión</a></p>
    </div>
</body>
</html>
