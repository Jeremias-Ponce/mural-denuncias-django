{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro Ciudadano</title>
    <!-- Vinculación a los estilos globales del proyecto -->
    <link rel="stylesheet" href="{% static 'denuncias/css/style.css' %}">
</head>
<body>
    <!-- Contenedor central con la estética visual consistente del sitio -->
    <div style="max-width: 400px; margin: 60px auto; background-color: #fdf5e6; padding: 30px; box-shadow: 4px 4px 12px rgba(0,0,0,0.3); font-family: sans-serif;">
        <h2 style="text-align: center; color: #3e2723;">REGISTRO (+18 AÑOS)</h2>
        
        <!-- Formulario de creación de usuario -->
        <form method="POST">
            <!-- Token de seguridad contra ataques CSRF -->
            {% csrf_token %}
            
            <!-- 
                {{ form.as_p }} renderiza automáticamente los campos definidos en el formulario de registro de Django.
                Esto incluye validaciones automáticas de datos según el modelo.
            -->
            {{ form.as_p }}
            
            <!-- Botón de envío para procesar el nuevo registro -->
            <button type="submit" style="width: 100%; background-color: #3e2723; color: white; padding: 10px; border: none; font-weight: bold; cursor: pointer;">
                Registrarse
            </button>
        </form>
        
        <!-- Enlace de navegación hacia el login para usuarios que ya poseen cuenta -->
        <p style="text-align: center; margin-top: 15px;">
            <a href="{% url 'login' %}" style="color: #cc0000; text-decoration: none;">¿Ya tienes cuenta? Inicia sesión</a>
        </p>
    </div>
</body>
</html>
