<div style="text-align: center; max-width: 400px; margin: auto; padding: 20px;">
    <h2>Elegir nueva contraseña</h2>
    
    {% if validlink %}
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" style="background-color: #3e2723; color: white; padding: 10px; border: none; width: 100%; cursor: pointer;">Cambiar contraseña</button>
        </form>
    {% else %}
        <p style="color: red;">El enlace de recuperación es inválido o ya ha caducado.</p>
    {% endif %}
</div>
