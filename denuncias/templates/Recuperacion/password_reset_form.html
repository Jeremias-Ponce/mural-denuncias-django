<div style="text-align: center; max-width: 400px; margin: auto; padding: 20px; background-color: #f9f9f9; border-radius: 8px;">
    <h2>Recuperar Contraseña</h2>
    <p>Ingresa tu correo electrónico y te enviaremos las instrucciones.</p>
    
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" style="background-color: #3e2723; color: white; padding: 10px; border: none; width: 100%; cursor: pointer;">Enviar correo</button>
    </form>
</div>
